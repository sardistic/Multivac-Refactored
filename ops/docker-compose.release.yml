services:
  multivac:
    user: "65532:65532"
    read_only: true
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - MULTIVAC_STATE_DIR=/state
      - MULTIVAC_TOOL_HOTLOAD_DIR=/tool-artifacts
      - MULTIVAC_TOOL_CONTROL_DIR=/state/tool-control
      - USAGE_DB_PATH=/state/usage_costs.db
      - USAGE_METRICS_PATH=/state/public/usage_metrics.json   # its own folder: the status dashboard mounts only this
      - REFLECTION_ENABLED=${REFLECTION_ENABLED:-true}
      - REFLECTION_DAILY_BUDGET_USD=${REFLECTION_DAILY_BUDGET_USD:-1.50}
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/app
    command: ["bash", "-c", "exec python main.py 2>&1 | tee /state/bot.log"]
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - ${MULTIVAC_APP_DIR:-.}:/app:ro
      - ./state:/state
      - ./state/bot.log:/app/bot.log
      - ./.git:/srv/multivac/.git:ro
      - /srv/multivac-releases:/srv/multivac-releases:ro
      - ${MULTIVAC_TOOL_ARTIFACTS_DIR:-/srv/multivac-tool-artifacts}:/tool-artifacts:ro
